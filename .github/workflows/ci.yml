# Every push to main and every pull request: the desktop app builds and all tests pass on Windows, Linux and macOS,
# and the Android app builds. The APK of each run can be downloaded from the run page (Artifacts).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # The solution also has the Android project, which needs the android workload, so the projects are built one by one.
      - name: Build the desktop app
        run: dotnet build src/Calculator.Desktop -c Release

      - name: Test the math core
        run: dotnet test tests/Calculator.Core.Tests -c Release

      # The UI tests run the real views in Avalonia's headless mode: no window, no display needed.
      - name: Test the user interface
        run: dotnet test tests/Calculator.UI.Tests -c Release

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 21

      - name: Install the android workload
        run: dotnet workload install android

      # The runner has the Android SDK ($ANDROID_HOME); this adds the platform the project targets if it is missing.
      - name: Install the Android SDK packages
        run: >
          dotnet build src/Calculator.Android -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=true

      - name: Build the APK
        run: dotnet publish src/Calculator.Android -c Release -p:AndroidSdkDirectory="$ANDROID_HOME" -o out

      - uses: actions/upload-artifact@v4
        with:
          name: BtlCalculator-android
          path: out/*-Signed.apk
          if-no-files-found: error
